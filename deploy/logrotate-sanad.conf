# Logrotate — Sanad (VPS)
# Installer :
#   sudo cp deploy/logrotate-sanad.conf /etc/logrotate.d/sanad
#   sudo mkdir -p /var/log/sanad
#   # pointer stdout Docker vers fichiers si besoin, ou :
#   docker compose logs -f backend >> /var/log/sanad/backend.log 2>&1 &
#
# Rotation : quotidien, 7 jours, compression.

/var/log/sanad/*.log {
    daily
    rotate 7
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    dateext
}
