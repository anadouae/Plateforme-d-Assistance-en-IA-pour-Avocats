# Production overrides — VPS Linux
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.vps up -d

services:
  backend:
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      # Toujours Postgres du compose (pas Neon)
      DATABASE_URL: postgresql://sanad:sanad_secret@postgres:5432/sanad
      WHISPER_ENABLED: ${WHISPER_ENABLED:-true}
      WHISPER_MODEL: ${WHISPER_MODEL:-medium}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8001}
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  minio:
    restart: unless-stopped

  ollama:
    restart: unless-stopped

  celery-worker:
    restart: unless-stopped
