# Pull Sanad images from the registry (no local build).
#
# Default = GitHub Container Registry (GHCR).
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.pull.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.pull.yml up -d
#
# First pull of private GHCR packages (if the repo/packages are private):
#   echo YOUR_GITHUB_PAT | docker login ghcr.io -u YOUR_GITHUB_USER --password-stdin
#
# Pin a version: SANAD_IMAGE_TAG=2026-08-13 (default: latest)
# Optional Docker Hub: SANAD_REGISTRY=docker.io/anadouae1

services:
  backend:
    image: ${SANAD_REGISTRY:-ghcr.io/anadouae}/sanad-backend:${SANAD_IMAGE_TAG:-latest}

  celery-worker:
    image: ${SANAD_REGISTRY:-ghcr.io/anadouae}/sanad-celery:${SANAD_IMAGE_TAG:-latest}

  frontend:
    image: ${SANAD_REGISTRY:-ghcr.io/anadouae}/sanad-frontend:${SANAD_IMAGE_TAG:-latest}
